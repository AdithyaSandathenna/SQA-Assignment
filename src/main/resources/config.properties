# ==============================================================
# LinkedIn UI Test Automation Configuration
# KDU IT3153 - Software Quality Assurance (Assignment 04)
# ==============================================================

# Browser settings: chrome or firefox
browser=chrome
headless=false

# Application URLs
baseUrl=https://www.linkedin.com/login

# Test Credentials (Dedicated test account recommended by assignment rules)
# Note: You can override these via command line: -Dlinkedin.username=... -Dlinkedin.password=...
valid.username=your_linkedin_email@example.com
valid.password=YourSecurePassword123!

invalid.username=invalid_user_test@example.com
invalid.password=WrongPasswordXYZ999!

# Search parameters
search.term=Software Testing

# Timeouts in seconds
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Security checkpoint manual pause (in seconds)
# If LinkedIn prompts with a verification puzzle/CAPTCHA, the framework waits so the tester can solve it manually.
checkpoint.timeout=20
